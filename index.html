<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skribbl Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Multiplayer canvas painting game 🎨</h1>

    <input type="text" placeholder="Enter your name" />
    <button onclick="startGame()">Start Game</button>
    <div class="footer">Made by You ✨</div>

    <!-- 🎨 Drawing Canvas -->
    <canvas id="drawing-board" width="800" height="500" style="display: none;"></canvas>

    <!-- 🛠️ Drawing Controls -->
    <div id="toolbar" style="display: none; margin-top: 20px;">
      <label for="colorPicker">Pen Color:</label>
      <input type="color" id="colorPicker" value="#333333" />

      <button onclick="setMode('pen')">🖊️ Pen</button>
      <button onclick="setMode('eraser')">🩹 Eraser</button>
      <button onclick="clearCanvas()">🧹 Clear</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
